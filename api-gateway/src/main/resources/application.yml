server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          # lb:// (not http://) tells the gateway to resolve "order-service"
          # through the LoadBalancer client backed by Eureka, instead of
          # dialing a fixed host:port.
          uri: lb://order-service
          predicates:
            - Path=/orders/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost              # ← add this line
    prefer-ip-address: false

logging:
  level:
    org.springframework.cloud.gateway: INFO
