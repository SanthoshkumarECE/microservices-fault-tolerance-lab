server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # This IS the registry - it doesn't need to register with itself or fetch a registry.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Fine for a single-node local demo; self-preservation is meant for
    # production networks with flaky links between multiple Eureka peers.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
